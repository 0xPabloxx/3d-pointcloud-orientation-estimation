# All K values: Train on mixed dataset
# Uses 4-peak model with learnable weights to handle different symmetries
# The model should learn to output different weight patterns for different K

name: vm_all_k
seed: 42

# Model configuration
backbone:
  type: pointnet++
  output_dim: 1024

head:
  type: vm_4peak_learnable
  hidden_dim: 256
  kappa_init: 5.0

# Loss configuration
loss:
  type: mvm_nll

# Data configuration
data:
  annotation_file: data_annotation/symmetry_annotations.json
  data_dir: data/full_mn40_normal_resampled_ply
  num_points: 1024
  k_filter: null  # All K values (1, 2, 4)
  align_pointcloud: true
  augment: true
  num_rotations: 12
  num_workers: 4

# Training configuration
training:
  batch_size: 16
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  save_every: 50
  scheduler:
    enabled: true
    step_size: 50
    gamma: 0.5

# WandB configuration
wandb:
  enabled: true
  project: forwardnet
